    <meta charset="utf-8">

    <meta
      name="description"
      content="漢字を入力すると、ブラウザ内だけで拼音と簡体字・繁體字の対応表をリアルタイム表示します。"
    >

        --panel: #fffdf8;
        --panel-soft: #f0f7f4;
        --line: #d8d0c2;
        --line-strong: #bcb09f;
        --text: #1e201d;
        --muted: #626a61;
        --accent: #1f6f5b;
        --accent-strong: #174f43;
        --warn: #8c4f1d;
        --shadow: 0 18px 50px rgba(45, 52, 45, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--text);
        background:
          linear-gradient(135deg, rgba(31, 111, 91, 0.1), transparent 34%),
          linear-gradient(180deg, var(--bg), #e7ece5);
        font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans CJK JP", sans-serif;
      }

      button,
      textarea {
        font: inherit;
      }

      .shell {
        width: min(1180px, calc(100% - 28px));
        margin: 0 auto;
        padding: 24px 0 56px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 18px;
      }

      .home {
        color: var(--accent);
        font-size: 0.92rem;
        font-weight: 700;
        text-decoration: none;
      }

      .home:hover {
        color: var(--accent-strong);
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 4vw, 3.8rem);
        line-height: 1.08;
      }

      .subtitle {
        max-width: 760px;
        margin: 12px 0 0;
        color: var(--muted);
        line-height: 1.8;
      }

      .workspace {
        display: grid;
        grid-template-columns: minmax(0, 0.95fr) minmax(0, 1.05fr);
        gap: 18px;
        margin-top: 24px;
      }

      .panel {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 253, 248, 0.94);
        box-shadow: var(--shadow);
      }

      .panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 16px;
        border-bottom: 1px solid var(--line);
      }

      .panel-title {
        margin: 0;
        font-size: 1rem;
      }

      .meta {
        color: var(--muted);
        font-size: 0.84rem;
      }

      .panel-body {
        padding: 16px;
      }

      .input-area,
      .readonly-area {
        width: 100%;
        min-height: 240px;
        resize: vertical;
        border: 1px solid var(--line-strong);
        border-radius: 8px;
        padding: 14px;
        color: var(--text);
        background: #fff;
        line-height: 1.75;
      }

      .input-area:focus,
      .readonly-area:focus {
        outline: 3px solid rgba(31, 111, 91, 0.2);
        border-color: var(--accent);
      }

      .readonly-area {
        min-height: 120px;
        background: #fbfcfa;
      }

      .sample-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 12px;
      }

      .sample-button,
      .copy-button {
        border: 1px solid var(--line-strong);
        border-radius: 8px;
        padding: 8px 12px;
        color: var(--accent-strong);
        background: #fff;
        cursor: pointer;
        font-weight: 700;
      }

      .sample-button:hover,
      .copy-button:hover {
        border-color: var(--accent);
        background: var(--panel-soft);
      }

      .result-stack {
        display: grid;
        gap: 14px;
      }

      .result-box {
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
        background: #fff;
      }

      .result-label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 12px;
        border-bottom: 1px solid var(--line);
        background: var(--panel-soft);
        color: var(--accent-strong);
        font-weight: 800;
      }

      .result-text {
        min-height: 58px;
        margin: 0;
        padding: 12px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        line-height: 1.8;
      }

      .table-panel {
        margin-top: 18px;
      }

      .table-wrap {
        overflow-x: auto;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
      }

      table {
        width: max-content;
        min-width: 100%;
        border-collapse: collapse;
      }

      th,
      td {
        border-bottom: 1px solid var(--line);
        border-right: 1px solid var(--line);
        padding: 10px 12px;
        text-align: center;
        vertical-align: middle;
      }

      th {
        position: sticky;
        left: 0;
        z-index: 1;
        min-width: 92px;
        background: #eef5f1;
        color: var(--accent-strong);
        font-size: 0.86rem;
        white-space: nowrap;
      }

      td {
        min-width: 64px;
        max-width: 110px;
        font-size: 1.25rem;
        overflow-wrap: anywhere;
      }

      tr:last-child th,
      tr:last-child td {
        border-bottom: 0;
      }

      .pinyin-cell {
        font-size: 0.88rem;
        line-height: 1.3;
      }

      .empty {
        padding: 22px;
        color: var(--muted);
        text-align: center;
      }

      .note {
        margin: 12px 0 0;
        color: var(--muted);
        font-size: 0.9rem;
        line-height: 1.7;
      }

      .status {
        min-width: 7em;
        color: var(--muted);
        font-size: 0.82rem;
        text-align: right;
      }

      .status.is-warn {
        color: var(--warn);
      }

      @media (max-width: 860px) {
        .workspace {
          grid-template-columns: 1fr;
        }

        .shell {
          width: min(100% - 20px, 1180px);
          padding-top: 16px;
        }

        .panel-body {
          padding: 12px;
        }

        .input-area {
          min-height: 180px;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <div class="topbar">
        <a class="home" href="/">koba-e964.com</a>
        <span class="meta">static / offline after load</span>
      </div>

      <header>
        <h1>拼音 converter</h1>
        <p class="subtitle">
          漢字を入力すると、拼音、簡体字、繁體字の対応をブラウザ内でリアルタイムに表示します。
          変換は文字単位です。
        </p>
      </header>

      <section class="workspace" aria-label="拼音変換">
        <section class="panel">
          <div class="panel-header">
            <h2 class="panel-title">入力</h2>
            <span class="meta" id="inputMeta">0文字</span>
          </div>
          <div class="panel-body">
            <textarea
              id="sourceText"
              class="input-area"
              spellcheck="false"
              autocomplete="off"
              placeholder="例: 日本&#10;简体字 / 簡體字&#10;繁体字 / 繁體字"
            ></textarea>
            <div class="sample-row" aria-label="サンプル入力">
              <button class="sample-button" type="button" data-sample="日本">日本</button>
              <button class="sample-button" type="button" data-sample="简体字 / 簡體字">简体字 / 簡體字</button>
              <button class="sample-button" type="button" data-sample="繁体字 / 繁體字">繁体字 / 繁體字</button>
            </div>
          </div>
        </section>

        <section class="panel">
          <div class="panel-header">
            <h2 class="panel-title">出力</h2>
            <span class="status" id="statusText">ready</span>
          </div>
          <div class="panel-body result-stack">
            <section class="result-box" aria-label="声調記号付き拼音">
              <div class="result-label">
                <span>声調記号付き拼音 (rì běn)</span>
                <button class="copy-button" type="button" data-copy-target="markedOutput">Copy</button>
              </div>
              <p class="result-text" id="markedOutput"></p>
            </section>

            <section class="result-box" aria-label="数字声調付き拼音">
              <div class="result-label">
                <span>数字声調付き拼音 (ri4 ben3)</span>
                <button class="copy-button" type="button" data-copy-target="numericOutput">Copy</button>
              </div>
              <p class="result-text" id="numericOutput"></p>
            </section>
          </div>
        </section>
      </section>

      <section class="panel table-panel" aria-label="文字対応表">
        <div class="panel-header">
          <h2 class="panel-title">対応表</h2>
        </div>
        <div class="panel-body">
          <div class="table-wrap" id="tableWrap">
            <div class="empty">入力すると、简体字・繁體字・pinyin を列ごとに表示します。</div>
          </div>
          <p class="note">
            多音字や語単位の読み分けは行わず、ページ内の文字辞書にある代表的な読みを表示します。
          </p>
          <label class="note" for="tablePinyinOutput">pinyin only</label>
          <textarea
            id="tablePinyinOutput"
            class="readonly-area"
            readonly
            spellcheck="false"
            aria-label="pinyin only"
          ></textarea>
        </div>
      </section>
    </main>

        ["请", "请", "請", "qing3"],
        ["請", "请", "請", "qing3"],
        ["谁", "谁", "誰", "shei2"],
        ["誰", "谁", "誰", "shei2"],
        ["谢", "谢", "謝", "xie4"],
        ["謝", "谢", "謝", "xie4"],
        ["这", "这", "這", "zhe4"],
        ["這", "这", "這", "zhe4"],
        ["那", "那", "那", "na4"],
        ["都", "都", "都", "dou1"],
        ["酒", "酒", "酒", "jiu3"],
        ["里", "里", "裡", "li3"],
        ["裡", "里", "裡", "li3"],
        ["钱", "钱", "錢", "qian2"],
        ["錢", "钱", "錢", "qian2"],
        ["问", "问", "問", "wen4"],
        ["問", "问", "問", "wen4"],
        ["间", "间", "間", "jian1"],
        ["間", "间", "間", "jian1"],
        ["電", "电", "電", "dian4"],
        ["零", "零", "零", "ling2"],
        ["面", "面", "面", "mian4"],
        ["饭", "饭", "飯", "fan4"],
        ["飯", "饭", "飯", "fan4"],
        ["高", "高", "高", "gao1"]
      ];

      const pinyinMap = new Map(PINYIN_DATA.map((entry) => [entry[0], {
        simplified: entry[1],
        traditional: entry[2],
        numeric: entry[3]
      }]));

      const toneMarks = {
        a: ["a", "ā", "á", "ǎ", "à"],
        e: ["e", "ē", "é", "ě", "è"],
        i: ["i", "ī", "í", "ǐ", "ì"],
        o: ["o", "ō", "ó", "ǒ", "ò"],
        u: ["u", "ū", "ú", "ǔ", "ù"],
        v: ["ü", "ǖ", "ǘ", "ǚ", "ǜ"],
        ü: ["ü", "ǖ", "ǘ", "ǚ", "ǜ"]
      };

      const sourceText = document.getElementById("sourceText");
      const inputMeta = document.getElementById("inputMeta");
      const markedOutput = document.getElementById("markedOutput");
      const numericOutput = document.getElementById("numericOutput");
      const tablePinyinOutput = document.getElementById("tablePinyinOutput");
      const tableWrap = document.getElementById("tableWrap");
      const statusText = document.getElementById("statusText");

      function toToneMarks(syllable) {
        const match = syllable.match(/^([a-züv:]+)([1-5])$/i);
        if (!match) {
          return syllable;
        }

        let body = match[1].toLowerCase().replace(/u:/g, "v");
        const tone = Number(match[2]);
        if (tone === 5 || tone === 0) {
          return body.replace(/v/g, "ü");
        }

        const markIndex = findToneIndex(body);
        if (markIndex < 0) {
          return body.replace(/v/g, "ü");
        }

        const vowel = body[markIndex];
        const marked = toneMarks[vowel][tone];
        return `${body.slice(0, markIndex)}${marked}${body.slice(markIndex + 1)}`.replace(/v/g, "ü");
      }

      function findToneIndex(body) {
        const aIndex = body.indexOf("a");
        if (aIndex >= 0) return aIndex;

        const eIndex = body.indexOf("e");
        if (eIndex >= 0) return eIndex;

        const ouIndex = body.indexOf("ou");
        if (ouIndex >= 0) return ouIndex;

        for (let index = body.length - 1; index >= 0; index -= 1) {
          if ("iouvü".includes(body[index])) {
            return index;
          }
        }
        return -1;
      }

      function isWhitespace(char) {
        return /\s/u.test(char);
      }

      function isAsciiPunctuation(char) {
        return /^[,.;:!?/\\()[\]{}'"，。！？、；：（）「」『』《》〈〉・-]$/u.test(char);
      }

      function appendToken(parts, token) {
        if (!token) return;
        const last = parts[parts.length - 1] || "";
        if (parts.length > 0 && last !== "\n" && last !== " " && !isAsciiPunctuation(token)) {
          parts.push(" ");
        }
        parts.push(token);
      }

      function appendLiteral(parts, char) {
        if (char === "\r") return;
        if (char === "\n") {
          while (parts[parts.length - 1] === " ") parts.pop();
          parts.push("\n");
          return;
        }
        if (isWhitespace(char)) {
          if (parts.length > 0 && parts[parts.length - 1] !== " " && parts[parts.length - 1] !== "\n") {
            parts.push(" ");
          }
          return;
        }
        parts.push(char);
      }

      function convertText(text) {
        const rows = [];
        const numericParts = [];
        const markedParts = [];
        let known = 0;
        let unknownHan = 0;

        for (const char of Array.from(text)) {
          const entry = pinyinMap.get(char);
          if (entry) {
            known += 1;
            appendToken(numericParts, entry.numeric);
            appendToken(markedParts, toToneMarks(entry.numeric));
            rows.push({
              simplified: entry.simplified,
              traditional: entry.traditional,
              pinyin: entry.numeric
            });
            continue;
          }

          if (/\p{Script=Han}/u.test(char)) {
            unknownHan += 1;
          }
          appendLiteral(numericParts, char);
          appendLiteral(markedParts, char);
          rows.push({
            simplified: char,
            traditional: char,
            pinyin: /\p{Script=Han}/u.test(char) ? "" : char
          });
        }

        return {
          numeric: numericParts.join("").trim(),
          marked: markedParts.join("").trim(),
          rows,
          known,
          unknownHan
        };
      }

      function renderTable(rows) {
        if (rows.length === 0) {
          tableWrap.innerHTML = '<div class="empty">入力すると、简体字・繁體字・pinyin を列ごとに表示します。</div>';
          return;
        }

        const table = document.createElement("table");
        const labels = [
          ["简体字", "simplified"],
          ["繁體字", "traditional"],
          ["pinyin", "pinyin"]
        ];

        for (const [label, key] of labels) {
          const tr = document.createElement("tr");
          const th = document.createElement("th");
          th.scope = "row";
          th.textContent = label;
          tr.appendChild(th);

          for (const row of rows) {
            const td = document.createElement("td");
            if (key === "pinyin") td.className = "pinyin-cell";
            td.textContent = row[key] || " ";
            tr.appendChild(td);
          }
          table.appendChild(tr);
        }

        tableWrap.replaceChildren(table);
      }

      function update() {
        const text = sourceText.value;
        const result = convertText(text);
        inputMeta.textContent = `${Array.from(text).length}文字`;
        markedOutput.textContent = result.marked;
        numericOutput.textContent = result.numeric;
        tablePinyinOutput.value = result.numeric;
        renderTable(result.rows);

        if (!text) {
          statusText.textContent = "ready";
          statusText.className = "status";
        } else if (result.unknownHan > 0) {
          statusText.textContent = `${result.unknownHan}文字未登録`;
          statusText.className = "status is-warn";
        } else {
          statusText.textContent = `${result.known}文字変換済`;
          statusText.className = "status";
        }
      }

      async function copyText(targetId, button) {
        const target = document.getElementById(targetId);
        const text = target.value ?? target.textContent;
        if (!text) return;

        try {
          await navigator.clipboard.writeText(text);
          const original = button.textContent;
          button.textContent = "Copied";
          setTimeout(() => {
            button.textContent = original;
          }, 900);
        } catch {
          tablePinyinOutput.value = text;
          tablePinyinOutput.focus();
          tablePinyinOutput.select();
        }
      }

      sourceText.addEventListener("input", update);

      for (const button of document.querySelectorAll("[data-sample]")) {
        button.addEventListener("click", () => {
          sourceText.value = button.dataset.sample;
          sourceText.focus();
          update();
        });
      }

      for (const button of document.querySelectorAll("[data-copy-target]")) {
        button.addEventListener("click", () => copyText(button.dataset.copyTarget, button));
      }

      sourceText.value = "日本\n简体字 / 簡體字\n繁体字 / 繁體字";
      update();
    </script>
  </body>
</html>
